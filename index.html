<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171719" />
    <title>Календарь учителя</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f7f5fd,#e3d7ff);font-family:Inter,system-ui,sans-serif;color:#19191d">
        <section style="width:min(420px,calc(100vw - 32px));background:#fff;border-radius:20px;padding:36px;box-shadow:0 25px 70px #6f559b2b;text-align:center">
          <div style="width:52px;height:52px;margin:0 auto 18px;border-radius:15px;background:#9b7be8;color:#fff;display:grid;place-items:center;font-weight:800">К</div>
          <strong>Загрузка календаря…</strong>
          <p style="color:#77727f;font-size:13px">Подождите несколько секунд</p>
        </section>
      </main>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root) root.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#f3efff;font-family:system-ui"><section style="max-width:620px;background:white;padding:32px;border-radius:18px"><h1 style="font-size:22px">Ошибка запуска</h1><p>Скопируйте этот текст и отправьте разработчику:</p><pre style="white-space:pre-wrap;color:#a6384b">' + String(event.message || 'Неизвестная ошибка').replace(/</g, '&lt;') + '</pre></section></main>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
